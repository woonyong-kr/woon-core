<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian Vault Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{ color-scheme: dark;
  --bg:#0f1014; --bg2:#14161c; --card:#181b22; --card2:#1e222b;
  --ink:#e9eaee; --muted:#969cab; --faint:#6c7382; --line:#262a35;
  --accent:#e89b6c; --accent2:#74c69d; --accent-soft:rgba(232,155,108,.14);
  --chip:#212531; --chip-hover:#2a2f3d; --ok:#74c69d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.28);}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",Roboto,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:26px 24px 70px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;
  padding-bottom:18px;margin-bottom:8px;border-bottom:1px solid var(--line);position:relative}
header.top::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;
  background:linear-gradient(90deg,var(--accent),transparent)}
h1{font-size:21px;margin:0 0 3px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--faint)}
.sub{color:var(--muted);font-size:12.5px;text-align:right}
section{margin-top:30px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:0 0 14px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#33384700}
.card .n{font-size:25px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .l{font-size:12px;color:var(--muted);margin-top:3px}
.card.alert{border-color:rgba(232,155,108,.35);background:linear-gradient(180deg,var(--accent-soft),var(--card))}
.card.alert .n{color:var(--accent)}
.card.good .n{color:var(--accent2)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 14px;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.chartbox{position:relative;height:248px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row a.name{color:var(--ink);text-decoration:none}
.row a.name:hover{color:var(--accent)}
.row .meta{color:var(--faint);font-size:12px;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{font-size:12.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);transition:.12s}
.tab:hover{color:var(--ink);border-color:#3a3f4d}
.tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--chip);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:.12s}
.chip:hover{background:var(--chip-hover);border-color:#3a3f4d}
.chip.active{background:var(--accent);color:#1a120c;border-color:var(--accent);font-weight:600}
.chip .c{opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
.chip.active .c{opacity:.7}
.tg{margin:13px 0 7px;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.searchbar{display:flex;gap:8px;margin-bottom:14px}
.searchbar input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--bg2);color:var(--ink);outline:none}
.searchbar input:focus{border-color:var(--accent)}
.searchbar input::placeholder{color:var(--faint)}
.btn{padding:10px 15px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:11px;cursor:pointer;font-size:13px;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#resultHead{font-size:12.5px;color:var(--muted);margin:6px 0 10px}
#resultHead b{color:var(--ink)}
.tablewrap{overflow:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 9px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
tr:hover td{background:var(--bg2)}
td a{color:var(--ink);text-decoration:none}
td a:hover{color:var(--accent)}
.dim{color:var(--faint)}
.empty{color:var(--ok);padding:10px 2px}
#err{display:none;background:rgba(224,122,95,.12);border:1px solid rgba(224,122,95,.4);color:#f0a98f;padding:13px 15px;border-radius:13px;margin-top:16px;font-size:13px;white-space:pre-wrap}
.foot{margin-top:34px;color:var(--faint);font-size:11.5px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="dot"></span>Vault Dashboard</h1>
      <div class="path" id="vaultPath">/Users/woonyong/workspace/vault</div>
    </div>
    <div class="sub" id="genTime">데이터를 불러오는 중…</div>
  </header>

  <div id="err"></div>

  <section id="cardsSec">
    <h2>전체 현황</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>분포 &amp; 추이</h2>
    <div class="grid2">
      <div class="panel">
        <h3>월별 노트 활동</h3>
        <div class="chartbox"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="panel">
        <h3>폴더별 노트 수</h3>
        <div class="chartbox"><canvas id="folderChart"></canvas></div>
      </div>
    </div>
  </section>

  <section>
    <h2>최근 활동 &amp; 관리가 필요한 노트</h2>
    <div class="grid2">
      <div class="panel">
        <h3>최근 수정된 노트</h3>
        <div class="list" id="recentList"></div>
      </div>
      <div class="panel">
        <div class="tabs" id="attnTabs"></div>
        <div class="list" id="attnList"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>탐색기</h2>
    <div class="panel">
      <div class="searchbar">
        <input id="searchInput" type="text" placeholder="노트 이름·경로·태그로 검색…">
        <button class="btn" id="searchBtn">검색</button>
        <button class="btn" id="clearBtn">초기화</button>
      </div>
      <div class="tg">폴더</div>
      <div class="chips" id="folderChips"></div>
      <div class="tg">태그</div>
      <div id="tagGroups"></div>
      <div id="resultHead"></div>
      <div class="tablewrap" id="resultBox"></div>
    </div>
  </section>

  <div class="foot">데이터는 볼트 스캔 시점의 스냅샷입니다.<br>매일 아침 예약 작업이 자동으로 다시 굽고, 수동 갱신은 "지금 새로고침해줘"라고 요청하면 됩니다.</div>
</div>

<script id="vault-data">window.__VAULT_DATA__ = /*__VAULT_DATA_START__*/ null /*__VAULT_DATA_END__*/;</script>
<script>
const VAULT_NAME = "vault";
let SUMMARY = null;
let ALLNOTES = [];

function $(id){return document.getElementById(id);}
function showErr(m){const e=$("err");e.style.display="block";e.textContent="문제가 발생했습니다:\n"+m;}
function nf(n){return (n||0).toLocaleString("en-US");}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

function ago(ts){
  const d=Math.floor(Date.now()/1000)-ts;
  if(d<0) return "방금";
  if(d<3600) return Math.floor(d/60)+"분 전";
  if(d<86400) return Math.floor(d/3600)+"시간 전";
  if(d<2592000) return Math.floor(d/86400)+"일 전";
  if(d<31536000) return Math.floor(d/2592000)+"개월 전";
  return Math.floor(d/31536000)+"년 전";
}
function obsidianUri(rel){
  const f=rel.replace(/\.md$/,"");
  return "obsidian://open?vault="+encodeURIComponent(VAULT_NAME)+"&file="+encodeURIComponent(f);
}

// ---------------- renderers ----------------
function renderCards(t){
  const defs=[
    ["notes","노트","plain"],["words","단어","plain"],["tags","태그","plain"],
    ["folders","폴더","plain"],["orphans","고아 노트","alert"],
    ["empty","빈 노트","alert"],["stale","오래된 노트","alert"]
  ];
  $("cards").innerHTML=defs.map(([k,l,kind])=>{
    let cls="";
    if(kind==="alert") cls=t[k]>0?"alert":"good";
    return `<div class="card ${cls}"><div class="n">${nf(t[k])}</div><div class="l">${l}</div></div>`;
  }).join("");
}

function noteRow(n){
  return `<div class="row">
     <a class="name" href="${obsidianUri(n.rel)}" title="${esc(n.rel)}">${esc(n.name)}</a>
     <span class="badge">${esc(n.folder)}</span>
     <span class="meta">${ago(n.mtime)} · ${nf(n.words)}자</span>
   </div>`;
}
function renderRecent(list){
  $("recentList").innerHTML = list.map(noteRow).join("") || '<div class="dim">없음</div>';
}

const ATTN=[["orphans","고아 (링크 없음)"],["stale","오래됨 (90일+)"],["empty","빈 노트"]];
function renderAttnTabs(){
  $("attnTabs").innerHTML=ATTN.map((a,i)=>
    `<div class="tab ${i===0?'active':''}" data-k="${a[0]}">${a[1]} <span class="badge">${SUMMARY[a[0]].length}</span></div>`).join("");
  $("attnTabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    $("attnTabs").querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); renderAttn(t.dataset.k);
  });
  renderAttn("orphans");
}
function renderAttn(k){
  const list=SUMMARY[k]||[];
  if(!list.length){$("attnList").innerHTML='<div class="empty">정리할 노트가 없습니다 ✓</div>';return;}
  $("attnList").innerHTML=list.map(noteRow).join("");
}

let trendC=null, folderC=null;
function renderCharts(s){
  const months=[...new Set([...s.trend.map(x=>x[0]),...s.created.map(x=>x[0])])].sort();
  const mMod=Object.fromEntries(s.trend), mNew=Object.fromEntries(s.created);
  const tick="#c4c8d2", grid="#242833";
  trendC=new Chart($("trendChart"),{type:"line",
    data:{labels:months,datasets:[
      {label:"생성",data:months.map(m=>mNew[m]||0),borderColor:"#e89b6c",backgroundColor:"rgba(232,155,108,.16)",fill:true,tension:.3,pointRadius:3,pointBackgroundColor:"#e89b6c"},
      {label:"수정",data:months.map(m=>mMod[m]||0),borderColor:"#74c69d",backgroundColor:"rgba(116,198,157,.13)",fill:true,tension:.3,pointRadius:3,pointBackgroundColor:"#74c69d"}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:tick,boxWidth:12,font:{size:12}}}},
      scales:{x:{ticks:{color:tick},grid:{color:grid}},y:{ticks:{color:tick,precision:0},grid:{color:grid},beginAtZero:true}}}});

  const fl=s.folders;
  const palette=["#e89b6c","#74c69d","#e6c171","#7aa2f7","#c39ac9","#e07a5f","#83c5be","#b5a886"];
  folderC=new Chart($("folderChart"),{type:"doughnut",
    data:{labels:fl.map(x=>x[0]),datasets:[{data:fl.map(x=>x[1]),
      backgroundColor:fl.map((_,i)=>palette[i%palette.length]),borderColor:"#181b22",borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"60%",
      plugins:{legend:{position:"right",labels:{color:tick,boxWidth:11,font:{size:11.5},padding:9}}}}});
}

// ---------------- explorer ----------------
let activeFilter={mode:"all",value:""};
function renderFolderChips(s){
  $("folderChips").innerHTML=s.folders.map(([f,c])=>
    `<div class="chip" data-mode="folder" data-val="${esc(f)}">${esc(f)}<span class="c">${c}</span></div>`).join("");
}
function renderTagChips(s){
  const groups={};
  s.tags.forEach(([t,c])=>{
    const ci=t.indexOf(":");
    const g=ci>0?t.slice(0,ci):"기타";
    (groups[g]=groups[g]||[]).push([t,c]);
  });
  const order=["domain","layer","area","topic"];
  const keys=Object.keys(groups).sort((a,b)=>{
    const ia=order.indexOf(a),ib=order.indexOf(b);
    return (ia<0?9:ia)-(ib<0?9:ib)||a.localeCompare(b);});
  $("tagGroups").innerHTML=keys.map(g=>{
    const chips=groups[g].slice(0,18).map(([t,c])=>{
      const ci=t.indexOf(":");const lbl=ci>0?t.slice(ci+1):t;
      return `<div class="chip" data-mode="tag" data-val="${esc(t)}">${esc(lbl)}<span class="c">${c}</span></div>`;
    }).join("");
    return `<div class="tg">${esc(g)}</div><div class="chips">${chips}</div>`;
  }).join("");
}
function bindChips(){
  document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    const same=ch.classList.contains("active");
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    if(same){activeFilter={mode:"all",value:""};doQuery();return;}
    ch.classList.add("active");
    activeFilter={mode:ch.dataset.mode,value:ch.dataset.val};
    doQuery();
  });
}
function doQuery(){
  const box=$("resultBox"), head=$("resultHead");
  const m=activeFilter.mode, v=(activeFilter.value||"").toLowerCase();
  let sel;
  if(m==="folder") sel=ALLNOTES.filter(n=>n.folder===activeFilter.value);
  else if(m==="tag") sel=ALLNOTES.filter(n=>(n.tags||[]).some(t=>t.toLowerCase()===v));
  else if(m==="search") sel=ALLNOTES.filter(n=>
      n.name.toLowerCase().includes(v)||n.rel.toLowerCase().includes(v)||
      (n.tags||[]).some(t=>t.toLowerCase().includes(v)));
  else sel=ALLNOTES.slice();
  sel.sort((a,b)=>b.mtime-a.mtime);
  const total=sel.length, shown=Math.min(150,total);
  const label = m==="all" ? "전체 노트"
    : m==="search" ? `검색 “${esc(activeFilter.value)}”`
    : `${m==="folder"?"폴더":"태그"} “${esc(activeFilter.value)}”`;
  head.innerHTML=`${label} — 전체 <b>${nf(total)}</b>개 중 ${nf(shown)}개 표시`;
  if(!total){box.innerHTML='<div class="dim">결과가 없습니다.</div>';return;}
  box.innerHTML=`<table><thead><tr>
      <th>노트</th><th>폴더</th><th class="num">단어</th>
      <th class="num">링크(밖/안)</th><th class="num">수정</th></tr></thead><tbody>${
    sel.slice(0,150).map(n=>`<tr>
      <td><a href="${obsidianUri(n.rel)}" title="${esc(n.rel)}">${esc(n.name)}</a></td>
      <td class="dim">${esc(n.folder)}</td>
      <td class="num">${nf(n.words)}</td>
      <td class="num">${n.nout}/${n.nback}</td>
      <td class="num">${ago(n.mtime)}</td></tr>`).join("")}</tbody></table>`;
}

// ---------------- boot ----------------
function boot(){
  try{
    const D=window.__VAULT_DATA__;
    if(!D||!D.summary) throw new Error("아직 데이터가 생성되지 않았습니다. analyze.py + build.py를 실행하세요.");
    const s=D.summary;
    SUMMARY=s;
    $("vaultPath").textContent=s.vault;
    const g=new Date(s.generated*1000);
    $("genTime").textContent="마지막 분석: "+g.toLocaleString("ko-KR");
    renderCards(s.totals);
    try{ renderCharts(s); }
    catch(ce){ const b=document.querySelector("#trendChart")?.closest(".grid2");
      if(b) b.insertAdjacentHTML("afterbegin",
        '<div class="dim" style="grid-column:1/-1">차트를 그리지 못했습니다: '+esc(String(ce.message||ce))+'</div>'); }
    renderRecent(s.recent);
    renderAttnTabs();
    renderFolderChips(s);
    renderTagChips(s);
    bindChips();

    ALLNOTES=D.notes||[];

    $("searchBtn").onclick=()=>{
      const v=$("searchInput").value.trim();
      document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
      activeFilter=v?{mode:"search",value:v}:{mode:"all",value:""};doQuery();
    };
    $("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("searchBtn").click();});
    $("clearBtn").onclick=()=>{
      $("searchInput").value="";
      document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
      activeFilter={mode:"all",value:""};doQuery();
    };
    doQuery();
  }catch(e){
    $("genTime").textContent="";
    showErr(String(e&&e.message||e));
  }
}
boot();
</script>
</body>
</html>
