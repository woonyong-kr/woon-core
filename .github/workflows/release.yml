name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/woon_${os}_${arch}${suffix}" ./cmd/woon
          done
          cd dist
          shasum -a 256 woon_* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
