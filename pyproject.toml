[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "woon-core"
version = "0.5.6"
description = "Deterministic control plane for the Woon development system"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=1.27,<2",
  "pdfplumber>=0.11.9,<0.12",
  "pypdf>=6.10,<7",
  "PyYAML>=6.0.2,<7",
  "tzdata>=2026.2; platform_system == 'Windows'",
]

[project.scripts]
woon = "woon_core.cli:main"
woon-global-instructions = "woon_core.context.global_instructions:main"
woon-knowledge-mcp = "woon_core.knowledge.mcp_server:main"
woon-tasks-mcp = "woon_core.tasks.mcp_server:main"
woon-people-mcp = "woon_core.people.mcp_server:main"
woon-reference-audit = "woon_core.knowledge.reference_audit:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/woon_core"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/woon-calendar-bridge.swift" = "woon_core/calendar/native/woon-calendar-bridge.swift"
"scripts/woon-calendar-export.swift" = "woon_core/calendar/native/woon-calendar-export.swift"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/woon_core/knowledge/vault_tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["woon_core"]
mypy_path = "src"
exclude = "^src/woon_core/knowledge/vault_tools/"
